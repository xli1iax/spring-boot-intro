databaseChangeLog:
  - changeSet:
      id: create-books-table
      author: lilia
      changes:
         - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: isbn
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: price
                  type: decimal(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(2056)

              - column:
                  name: cover_image
                  type: varchar(512)

              - column:
                  name: is_deleted
                  type: bit
                  defaultValueBoolean: false
                  constraints:
                    nullable: false